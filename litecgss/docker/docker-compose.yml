version: '3'
services:
    litecgss:
        network_mode: host
        build: .
        stdin_open: true
        tty: true
        container_name: litecgss
        entrypoint: /entrypoint.sh
        environment: 
            - DISPLAY=:1
        ports:
            - "127.0.0.1:5901:5900"
        volumes:
            - ..:/litecgss
    litecgss_test:
        network_mode: host
        build: ./test
        container_name: litecgss_test
        entrypoint: /entrypoint.sh
        volumes:
            - ../generated/html:/html
            - ..:/litecgss