stages:
  - compile
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive

compile:linux:gcc:
  stage: compile
  tags:
    - linux
  image: 'scorbutics/sfml-rake:latest'
  before_script:
    - rake configure
    - rake clean
  script:
    - rake compile
  artifacts:
    name: "LiteCGSS-linux-gcc-$CI_COMMIT_REF_NAME"
    paths:
      - bin/
      - lib/
    expire_in: 1 day

compile:linux:clang:
  stage: compile
  tags:
    - linux
  image: 'scorbutics/sfml-rake:latest'
  before_script:
    - apt-get update && apt-get -y install clang
    - export CC=/usr/bin/clang
    - export CXX=/usr/bin/clang++
    - rake configure
    - rake clean
  script:
    - rake compile
  artifacts:
    name: "LiteCGSS-linux-clang-$CI_COMMIT_REF_NAME"
    paths:
      - bin/
      - lib/
    expire_in: 1 day

compile:windows:msvc:
  stage: compile
  tags:
    - windows
  before_script:
    - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
    - choco install git --force --params "/GitAndUnixToolsOnPath" -y
    - choco install 7zip -y
    - choco install cmake.install --installargs 'ADD_CMAKE_TO_PATH=System' -y
    - gem install rake-compiler
    - refreshenv
    - rake "configure[msvc]"
    - rake clean
  script:
    - rake compile
  artifacts:
    name: "LiteCGSS-win-msvc-$CI_COMMIT_REF_NAME"
    paths:
      - bin/
      - lib/
    expire_in: 1 day

compile:windows:mingw:
  stage: compile
  tags:
    - windows
  before_script:
    - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
    - choco install 7zip -y
    - choco install cmake.install --installargs 'ADD_CMAKE_TO_PATH=System' -y
    - gem install rake-compiler
    - refreshenv
    - $env:Path = (Get-Item .).FullName + "\generated\rubyinstaller-2.6.6-1-x86\bin;" + $env:Path
    - powershell.exe -File "build/export_env.ps1"
    - rake configure
  script:
    - rake clean
    - rake compile
  artifacts:
    name: "LiteCGSS-win-mingw-$CI_COMMIT_REF_NAME"
    paths:
      - bin/
      - lib/
    expire_in: 1 day

test:
  stage: test
  tags:
    - linux
  image: 'scorbutics/sfml-exec:latest'
  script: 
    - export LD_LIBRARY_PATH=$pwd/lib:$LD_LIBRARY_PATH
    - Xvfb :1 -screen 0 800x600x24+32 &
    - export DISPLAY=:1
    - sleep 5
    - ./bin/LiteCGSS_test
  dependencies:
    - compile:linux:gcc
